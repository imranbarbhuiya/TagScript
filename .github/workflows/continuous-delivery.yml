name: Continuous Delivery

on:
  push:
    tags:
      - '**@*'

jobs:
  Publish:
    name: Publish
    runs-on: ubuntu-latest
    if: github.repository_owner == 'imranbarbhuiya'
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Use Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Resolve released package
        id: package
        run: |
          PACKAGE_NAME="${GITHUB_REF_NAME%@*}"
          PACKAGE_DIR=$(
            for dir in packages/*; do
              if [ "$(node -p "require('./$dir/package.json').name")" = "$PACKAGE_NAME" ]; then
                echo "$dir"
                break
              fi
            done
          )
          if [ -z "$PACKAGE_DIR" ]; then
            echo "No workspace package matches tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./$PACKAGE_DIR/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build all packages
        run: bun run build --filter="./packages/*"
      - name: Resolve workspace dependencies
        run: bun scripts/resolveWorkspaceDeps.mjs "${{ steps.package.outputs.dir }}"
      - name: Publish
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
          else
            npm publish --access public --provenance --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
      - name: Extract release notes from the changelog
        run: bun scripts/extractChangelog.mjs "${{ steps.package.outputs.dir }}" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md" || true
      - name: Create GitHub Release
        run: |
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          else
            echo "No changelog entry found, falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
