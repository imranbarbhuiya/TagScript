name: Continuous Delivery

on:
  push:
    tags:
      - '**@*'

jobs:
  Publish:
    name: Publish
    runs-on: ubuntu-latest
    if: github.repository_owner == 'imranbarbhuiya'
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Use Node.js v24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Resolve released package
        id: package
        run: |
          PACKAGE_NAME="${GITHUB_REF_NAME%@*}"
          PACKAGE_DIR=$(
            for dir in packages/*; do
              if [ "$(node -p "require('./$dir/package.json').name")" = "$PACKAGE_NAME" ]; then
                echo "$dir"
                break
              fi
            done
          )
          if [ -z "$PACKAGE_DIR" ]; then
            echo "No workspace package matches tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./$PACKAGE_DIR/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build all packages
        run: bun run build --filter="./packages/*"
      - name: Resolve workspace dependencies
        run: bun scripts/resolveWorkspaceDeps.mjs "${{ steps.package.outputs.dir }}"
      - name: Publish
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
          else
            npm publish --access public --provenance --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
